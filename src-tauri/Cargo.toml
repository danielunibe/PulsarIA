[package]
name = "tiktok-processor"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
ort = { version = "2.0.0-rc.3", features = ["download-binaries", "directml"] }
tokenizers = "0.19"
ndarray = "0.15"
hnsw = { version = "0.11.0", features = ["serde"] }
space = { version = "0.17.0", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
num_cpus = "1.17.0"
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
rand_pcg = { version = "0.3", features = ["serde1"] }
rand_core = "0.6"
axum = "0.7"
tokio-cron-scheduler = "0.10"
bincode = "1.3.3"
smallvec = { version = "1.15.1", features = ["serde"] }
serde-big-array = "0.5.1"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "auth", "cors"] }
dotenvy = "0.15.7"
redis = { version = "1.0.5", features = ["tokio-comp"] }
sha2 = "0.10.9"
reqwest = { version = "0.13.2", features = ["json"] }
jsonwebtoken = "10.3.0"
rand = "0.10.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
esaxx-rs = { path = "./esaxx-rs-patch" }

