# ============================================================
# PULSARIA — OFFICIAL DOCKER COMPOSE CONFIGURATION
# ============================================================
# Usage:
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f
#   docker compose down
# ============================================================

services:
  # ── Python Worker Service ─────────────────────────────────
  # Executes yt-dlp downloading, ffmpeg audio conversion,
  # faster-whisper transcription, Pillow visual analysis.
  worker:
    build:
      context: .
      dockerfile: python-workers/Dockerfile
    container_name: pulsar-worker
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PULSAR_DOWNLOAD_DIR=/app/data
      - PYTHONPATH=/app/python-workers
    volumes:
      - ./data:/app/data
      - ./python-workers:/app/python-workers
      - ./assets:/app/assets
    networks:
      - pulsar-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import yt_dlp, ffmpeg, faster_whisper, curl_cffi, PIL; print(\"OK\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Redis Cache Service ───────────────────────────────────
  # In-memory store for high-performance semantic search cache.
  redis:
    image: redis:7-alpine
    container_name: pulsar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pulsar-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Frontend Web Dashboard (Next.js) ─────────────────────
  # Web interface providing video ingestion, live queue monitoring,
  # searchable transcript viewer, and video playback.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsar-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_REST_API_BASE=http://localhost:8080/api/v1
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks:
      - pulsar-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  pulsar-net:
    driver: bridge

volumes:
  redis_data:
    driver: local
