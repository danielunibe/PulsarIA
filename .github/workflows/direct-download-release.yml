name: Pulsaria direct GitHub prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Reviewed tag already merged into main, for example v0.1.0-beta.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pulsaria-direct-download-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      artifact_id: ${{ steps.assets.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    env:
      PULSARIA_RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Validate reviewed source and prerelease tag
        id: source
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Dispatch this release workflow from the reviewed main branch.'
          }
          if ($env:PULSARIA_RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+-(beta|rc)\.\d+$') {
            throw 'Direct-download workflow accepts versioned beta/rc prerelease tags only.'
          }
          $tagCommit = git rev-parse "$env:PULSARIA_RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) { throw 'The requested release tag does not resolve to a commit.' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $headCommit -ne $tagCommit) { throw 'Checked-out source does not match the requested release tag.' }
          git merge-base --is-ancestor $tagCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release tag must point to a commit already merged into main.' }
          $changes = git status --porcelain
          if ($LASTEXITCODE -ne 0 -or $changes) { throw 'Tagged release checkout must start clean.' }
          "commit=$tagCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          $expectedVersion = $env:PULSARIA_RELEASE_TAG -replace '^v', ''
          $sourceVersion = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0 -or $sourceVersion -ne $expectedVersion) { throw 'Tag version must match the version already recorded in the approved source.' }
          npm run verify:versions
          if ($LASTEXITCODE -ne 0) { throw 'Source version contract failed.' }

      - name: Prepare runtime from pinned public GitHub release
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-runtime-from-pinned-release.ps1 -ProjectRoot $PWD.Path
          if ($LASTEXITCODE -ne 0) { throw 'Pinned GitHub runtime bootstrap failed.' }

      - name: Verify source, component inventory, and legal gate
        run: |
          npm run verify:canonical
          if ($LASTEXITCODE -ne 0) { throw 'Canonical source gate failed.' }
          npm run verify:frontend-a11y
          if ($LASTEXITCODE -ne 0) { throw 'Frontend accessibility contract failed.' }
          npm run verify:icons
          if ($LASTEXITCODE -ne 0) { throw 'Web and native icon asset contract failed.' }
          $npmSbomPath = Join-Path $env:RUNNER_TEMP 'pulsaria-npm.spdx.json'
          $sbomPath = Join-Path $env:RUNNER_TEMP 'pulsaria-release.spdx.json'
          npm sbom --omit=dev --sbom-format=spdx --sbom-type=application | Set-Content -LiteralPath $npmSbomPath -Encoding utf8
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $npmSbomPath -PathType Leaf)) { throw 'npm SPDX generation failed.' }
          node scripts/create-release-sbom.mjs --npm-sbom $npmSbomPath --output $sbomPath
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $sbomPath -PathType Leaf)) { throw 'Aggregate release SPDX generation failed.' }
          $materialsRoot = Join-Path $env:RUNNER_TEMP 'pulsaria-third-party-materials'
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-direct-release-materials.ps1 -DestinationRoot $materialsRoot
          if ($LASTEXITCODE -ne 0) { throw 'Third-party source/build preparation failed.' }
          npm run verify:legal-release -- -RequireSbom -SbomPath $sbomPath -MaterialsRoot $materialsRoot
          if ($LASTEXITCODE -ne 0) { throw 'Legal and component review gate failed.' }
          npm run verify:local-llm
          if ($LASTEXITCODE -ne 0) { throw 'Local model and sidecar gate failed.' }
          npm run verify:mvp
          if ($LASTEXITCODE -ne 0) { throw 'MVP gate failed.' }
          npm run verify:api
          if ($LASTEXITCODE -ne 0) { throw 'API boundary gate failed.' }
          npm audit --omit=dev --audit-level=low
          if ($LASTEXITCODE -ne 0) { throw 'Production dependency audit failed.' }

      - name: Build direct-download NSIS bundle
        env:
          NEXT_PUBLIC_PULSARIA_UPDATER_ENABLED: 'false'
        run: |
          npm run tauri build -- --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Direct-download Tauri NSIS build failed.' }

      - name: Smoke test installed NSIS bundle
        run: |
          npm run verify:installed -- -Configuration release -Bundle nsis -ApiPort 8080
          if ($LASTEXITCODE -ne 0) { throw 'Installed NSIS smoke failed.' }

      - name: Stage and verify public assets
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE 'target-tauri/release/bundle'
          $stageRoot = Join-Path $bundleRoot 'direct-assets'
          $installerName = "Pulsaria_$($env:PULSARIA_RELEASE_TAG -replace '^v', '')_x64-setup.exe"
          $installer = Join-Path $bundleRoot "nsis/$installerName"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Versioned NSIS installer missing: $installerName" }
          $sbomPath = Join-Path $env:RUNNER_TEMP 'pulsaria-release.spdx.json'
          # Tauri regenerates the runtime manifest. Inventory the final inputs.
          node scripts/create-release-sbom.mjs --npm-sbom (Join-Path $env:RUNNER_TEMP 'pulsaria-npm.spdx.json') --output $sbomPath
          if ($LASTEXITCODE -ne 0) { throw 'Final aggregate SPDX generation failed.' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stage-direct-release.ps1 -ArtifactRoot $stageRoot -InstallerPath $installer -SbomPath $sbomPath -MaterialsRoot (Join-Path $env:RUNNER_TEMP 'pulsaria-third-party-materials') -ReleaseTag $env:PULSARIA_RELEASE_TAG -SourceCommit $env:SOURCE_COMMIT -RunId $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Direct-download artifact gate failed.' }
          "DIRECT_RELEASE_ASSET_ROOT=$stageRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-Content (Join-Path $stageRoot 'SHA256SUMS.txt') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Preserve the exact candidate for final acceptance
        id: assets
        uses: actions/upload-artifact@v7
        with:
          name: pulsaria-direct-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIRECT_RELEASE_ASSET_ROOT }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    environment:
      name: direct-download
    defaults:
      run:
        shell: pwsh
    env:
      PULSARIA_RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
    steps:
      - name: Check out the source that produced the accepted candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          fetch-depth: 0

      - name: Enforce final publication approval
        env:
          DIRECT_DOWNLOAD_RELEASE_READY: ${{ vars.DIRECT_DOWNLOAD_RELEASE_READY }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main' -or $env:DIRECT_DOWNLOAD_RELEASE_READY -ne 'true') {
            throw 'Publish from main only after legal review and acceptance of this exact artifact; DIRECT_DOWNLOAD_RELEASE_READY must be true.'
          }
          $tagCommit = git rev-parse "$env:PULSARIA_RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:SOURCE_COMMIT) { throw 'Release tag changed after construction.' }
          git merge-base --is-ancestor $env:SOURCE_COMMIT refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Accepted source must remain integrated in main.' }

      - name: Download the immutable artifact by its build output ID
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: accepted-assets
          merge-multiple: true

      - name: Verify the accepted assets without rebuilding
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-direct-release-artifacts.ps1 -ArtifactRoot ./accepted-assets -ReleaseVersion ($env:PULSARIA_RELEASE_TAG -replace '^v', '') -ExpectedCommit $env:SOURCE_COMMIT -ExpectedRunId $env:GITHUB_RUN_ID -AssetsOnly
          if ($LASTEXITCODE -ne 0) { throw 'Accepted release assets changed.' }

      - name: Publish free GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:PULSARIA_RELEASE_TAG -replace '^v', ''
          $notesPath = Join-Path $env:RUNNER_TEMP 'pulsaria-direct-release-notes.md'
          if (-not (Select-String -LiteralPath docs/BETA3_RELEASE_NOTES.md -Pattern $version -SimpleMatch -Quiet)) { throw 'Release notes must match the accepted version.' }
          Copy-Item -LiteralPath docs/BETA3_RELEASE_NOTES.md -Destination $notesPath
          $assets = @(Get-ChildItem -LiteralPath ./accepted-assets -File | Sort-Object Name | ForEach-Object { $_.FullName })
          $arguments = @('release', 'create', $env:PULSARIA_RELEASE_TAG, '--repo', 'danielunibe/PulsarIA', '--title', 'Pulsaria Beta 3', '--notes-file', $notesPath, '--prerelease', '--verify-tag')
          $arguments += $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease publication failed.' }

      - name: Verify the public download matches the accepted installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $publicRoot = Join-Path $env:RUNNER_TEMP "pulsaria-public-$env:GITHUB_RUN_ID"
          gh release download $env:PULSARIA_RELEASE_TAG --repo danielunibe/PulsarIA --dir $publicRoot
          if ($LASTEXITCODE -ne 0) { throw 'Public release download failed.' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-direct-release-artifacts.ps1 -ArtifactRoot $publicRoot -ReleaseVersion ($env:PULSARIA_RELEASE_TAG -replace '^v', '') -ExpectedCommit $env:SOURCE_COMMIT -ExpectedRunId $env:GITHUB_RUN_ID -AssetsOnly
          if ($LASTEXITCODE -ne 0) { throw 'Public release verification failed.' }
          $acceptedChecksums = Get-FileHash ./accepted-assets/SHA256SUMS.txt -Algorithm SHA256
          $publicChecksums = Get-FileHash (Join-Path $publicRoot 'SHA256SUMS.txt') -Algorithm SHA256
          if ($acceptedChecksums.Hash -ne $publicChecksums.Hash) { throw 'Public hashes differ from accepted hashes.' }
