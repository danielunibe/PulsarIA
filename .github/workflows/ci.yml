name: Pulsaria canonical CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-canonical-source:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify canonical structure
        run: npm run verify:canonical

      - name: Verify frontend contracts
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed.' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }

      - name: Verify Rust contracts
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed.' }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust check failed.' }
          cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }

      - name: Verify Python contracts
        run: npm run test:python
