name: Pulsaria canonical CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-canonical-source:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify canonical structure
        run: npm run verify:canonical

      - name: Verify frontend contracts
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed.' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }

      - name: Verify Rust contracts
        run: |
          # A clean source checkout intentionally has no external runtime
          # (Python, models, or FFmpeg). Keep source validation independent of
          # that release-only bundle while preserving the full config for the
          # signed Tauri build in release.yml.
          $config = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $config.bundle.resources = @{}
          $config.bundle.targets = @()
          $env:TAURI_CONFIG = $config | ConvertTo-Json -Depth 20 -Compress
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed.' }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust check failed.' }
          cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }

      - name: Verify Python contracts
        run: npm run test:python
