name: Pulsaria canonical CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-canonical-source:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify canonical structure
        run: npm run verify:canonical

      - name: Verify frontend contracts
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed.' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }

      - name: Verify Rust contracts
        run: |
          # A clean source checkout intentionally has no external runtime
          # (Python, models, or FFmpeg). tauri-build still requires the
          # configured resource directories to exist during source checks, so
          # create empty CI-only directories without adding runtime artifacts
          # to Git. The signed release build uses the full prepared bundle.
          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/python' | Out-Null
          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/assets' | Out-Null
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed.' }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust check failed.' }
          cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }

      - name: Prepare source-only Python contract fixture
        run: |
          # The portable Python runtime is supplied by the release bundle.
          # Keep only its small import-path contract in this source-check job;
          # do not commit Python, models, or site-packages to the repository.
          $pythonPth = 'src-tauri/resources/python/python311._pth'
          if (-not (Test-Path -LiteralPath $pythonPth)) {
            @(
              'python311.zip'
              '.'
              '..\python-workers'
              '..\..\..\python-workers'
              'Lib\site-packages'
              ''
              '# Cargar site-packages del runtime portable bundleado.'
              'import site'
            ) | Set-Content -LiteralPath $pythonPth -Encoding ascii
          }

      - name: Verify Python contracts
        run: npm run test:python
